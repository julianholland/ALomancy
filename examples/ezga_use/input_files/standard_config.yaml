general:
  al_workflow: "committee_uncertainty"
  elements: ["C", "Na"]  # atomic symbols, not atomic numbers -- match your system
  initial_train_file_path: "input_files/C_Na_amorphous_5255_train.xyz"
  initial_test_file_path: "input_files/C_Na_amorphous_583_test.xyz"
  number_of_al_loops: 25
  verbose: 1
  start_loop: 0
  committee_uncertainty_kwargs:
    number_models_in_committee: 5
    target_config_types:
      - "IsolatedAtom"
      - "init_dimer"
    test_ratio: 0.1

initialization:
  name: "initialization"
  max_time: "2H"
  mp_kwargs:
    max_atom_number: 20
    mp_max_energy_above_hull: 0.1
  dimer_kwargs:
    num_dimers_per_combo: 10
  trimer_kwargs:
    num_trimers_per_combo: 5
  amorphous_kwargs:
    num_amorphous: 300
    amorphous_atom_number: 20
    densities_list: [1.0, 2.0, 3.0]
  stretch_compress_targets_kwargs:
    num_stretch_compress_per_target: 5
    max_lattice_deformation: 0.2
  hpc: 'raven'

training:
  name: "training"
  trainer: "mace"
  max_time: "5H"
  # Every mace_kwargs field below not shown already matches trainer.py's
  # own _MACE_KWARGS_DEFAULTS -- E0s in particular needs no explicit value
  # at all now, since it's auto-resolved from IsolatedAtom structures
  # already in the GlobalDatabase.
  mace_kwargs:
    max_num_epochs: 80
  hpc: 'raccoon_big'

# This example demonstrates EZGA (genetic-algorithm) structure generation as
# an alternative to the default MD-based candidate generation shown in
# examples/basic_use/. Set structure_generation.generator: "ezga" to switch;
# everything downstream (bond-distance filtering, committee force-std-dev
# scoring, DFT evaluation) is unchanged either way -- EZGA only replaces how
# candidate structures are produced. Unlike MD, EZGA runs entirely in the
# local driver process (no remote submission of its own) and only exercises
# the single best-fit committee model (device="cpu", hardcoded) to relax
# candidates internally, so md_kwargs is not used here.
structure_generation:
  name: "structure_generation"
  generator: "ezga"
  desired_number_of_structures: 50
  max_time: "10H"
  structure_selection_kwargs:
    chem_formula_list: null
    atom_number_range: [2, 21]  # must stay within ezga_kwargs' min_atoms/max_atoms below
  ezga_kwargs:
    max_generations: 2
    population_size: 2
    min_atoms: 2
    max_atoms: 21
    mutation_operators:
      rattle:
        enabled: true
        std: 0.05
        species: ["Na"]
      random_strain:
        enabled: true
        max_strain: 0.02
      add:
        enabled: true
        species: ["Na"]
        bound: ["Na", "C"]
        collision_tolerance: 2.0
        slab: false
      remove:
        enabled: true
        species: "Na"
      remove_add:
        enabled: false
  hpc: 'raccoon_small'

high_accuracy_evaluation:
  name: "high_accuracy_evaluation"
  evaluator: "qe"
  max_time: "30m"
  qe_kwargs:
    system:
      input_dft: "pbe"
  hpc: 'raven'
