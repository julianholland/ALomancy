general:
  al_workflow: "committee_uncertainty"
  elements: ["C", "Na"]  # atomic symbols, not atomic numbers -- match your system
  # Cold start: initialization builds the first training set. To warm start
  # from your own labelled data instead, uncomment start_from and point it
  # at your files (other start modes: docs/starting_a_run.md).
  # start_from:
  #   train_xyz: "input_files/my_train.xyz"
  #   test_xyz: "input_files/my_test.xyz"
  num_of_al_loops: 25
  num_of_structures_per_loop: 50  # selected for DFT each loop
  verbose: 1
  start_loop: 0
  dataset_kwargs:
    target_config_types:
      - "IsolatedAtom"
      - "init_dimer"
    test_ratio: 0.1
  committee_uncertainty_kwargs:
    num_of_models_in_committee: 5

initialization:
  max_time: "2H"
  mp_kwargs:
    max_num_of_atoms: 20
    mp_max_energy_above_hull: 0.1
  dimer_kwargs:
    num_of_dimers_per_combo: 10
  trimer_kwargs:
    num_of_trimers_per_combo: 5
  amorphous_kwargs:
    num_of_amorphous_structures: 300
    num_of_atoms_per_amorphous: 20
    densities_list: [1.0, 2.0, 3.0]
  stretch_compress_targets_kwargs:
    num_of_stretch_compress_per_target: 5
    max_lattice_deformation: 0.2
  hpc: 'raven'

training:
  trainer: "mace"
  max_time: "5H"
  # Every mace_kwargs field below not shown already matches trainer.py's
  # own _MACE_KWARGS_DEFAULTS -- E0s in particular needs no explicit value
  # at all now, since it's auto-resolved from IsolatedAtom structures
  # already in the GlobalDatabase.
  mace_kwargs:
    max_num_epochs: 80
  hpc: 'raccoon_big'

# This example demonstrates EZGA (genetic-algorithm) structure generation as
# an alternative to the default MD-based candidate generation shown in
# examples/basic_use/. Set structure_generation.generator: "ezga" to switch;
# everything downstream (bond-distance filtering, committee force-std-dev
# scoring, DFT evaluation) is unchanged either way -- EZGA only replaces how
# candidate structures are produced.
#
# ezga_kwargs is EZGA's own config (what its YAML file holds). ALomancy adds
# the calculator (this loop's best model, built on the node and wrapped in
# EZGA's ase_calculator with the simulator.calculator settings below), the
# seeds, the output/database paths, resume and rng (from general.seed).
# Leave out any section to use ALomancy's defaults, taken from the EZGA
# wiki's MLIP active-learning example: population (multiobjective.size) 100,
# max_generations derived to give twice num_of_structures_to_generate, full
# relaxations (fmax 0.05, up to 100 steps), selection temperature 0.05,
# collision_factor 0.6, composition niching, and mutations for every element
# in general.elements (rattle, strain, add/remove per element, swaps for
# every pair). The search runs as one job on structure_generation.hpc; the
# candidates are the most recent generations' structures in EZGA's database.
structure_generation:
  generator: "ezga"
  num_of_structures_to_generate: 500  # candidate pool (default 10x per loop)
  max_time: "10H"
  structure_selection_kwargs:
    chem_formula_list: null
    atom_number_range: [2, 21]  # seed filter; also bounds the default add/remove
  ezga_kwargs:
    structure_selection_kwargs:  # ALomancy's: how many training structures seed EZGA
      num_of_seeds: 8
    # Optional, as in the wiki: HiSE stages in growing supercells, the last
    # with a short MD burst (300-600 K across the population) for
    # force-rich structures. Only the last stage's structures become
    # candidates (docs/ezga.md).
    # hise:
    #   supercells: [[1, 1, 1], [2, 1, 1]]
    #   overrides:
    #     max_generations: [10, 2]
    #     multiobjective.size: [100, 250]
    #     simulator.calculator:      # ase_calculator settings per stage
    #       - {}
    #       - {nvt_steps: 40, T: [300, 600]}
  hpc: 'raccoon_small'

high_accuracy_evaluation:
  evaluator: "qe"
  max_time: "30m"
  qe_kwargs:
    system:
      input_dft: "pbe"
  hpc: 'raven'
