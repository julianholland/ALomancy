# Committee uncertainty with SevenNet instead of MACE, warm-started from an
# existing labelled xyz file (labels are normalized on import, structures
# with elements outside general.elements are dropped). Requires `sevenn`
# on the HPC nodes that train.

general:
  al_workflow: "committee_uncertainty"
  elements: ["C"]
  num_of_al_loops: 10
  num_of_structures_per_loop: 20
  dataset_kwargs:
    target_config_types: ["external"]  # imported structures without a config_type
    test_ratio: 0.1
  start_from:
    xyz: "my_labelled_structures.xyz"  # needs energies and forces
  committee_uncertainty_kwargs:
    num_of_models_in_committee: 3

initialization:
  max_time: "2H"
  hpc: "my_cpu_hpc"
  mp_kwargs:
    enabled: false                     # the imported data covers bulk structures

training:
  trainer: "sevennet"
  max_time: "24H"
  hpc: "my_gpu_hpc"
  sevennet_kwargs:                     # SevenNet's own input.yaml sections
    model:
      cutoff: 5.0
      channel: 32
    train:
      epoch: "dynamic"
      is_train_stress: false
    data:
      batch_size: 4

structure_generation:
  generator: "md"
  num_of_structures_to_generate: 200
  max_time: "10H"
  hpc: "my_gpu_hpc"
  md_kwargs:
    steps: 50000
    ensemble: "npt"
    pressure: 1.0                      # GPa
    temperature: 300
    timestep_fs: 0.3

high_accuracy_evaluation:
  evaluator: "qe"
  max_time: "30m"
  max_go_time: "10H"
  force_ceiling: 10.0
  hpc: "my_cpu_hpc"
  qe_kwargs:                           # merged key by key into QE's defaults
    electrons:
      startingwfc: "atomic+random"
