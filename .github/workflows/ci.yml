name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Check formatting with ruff
        run: uv run ruff format --check src tests

      - name: Type check with mypy
        run: uv run mypy src/alomancy
        continue-on-error: true  # Allow to continue if mypy fails

  test:
    runs-on: ${{ matrix.os }}
    needs: lint  # Run tests after linting passes
    strategy:
      fail-fast: false
      # Pull requests: one Linux job. Pushes and releases: the full matrix.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","python-version":"3.12"}]' || '[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.10"},{"os":"macos-latest","python-version":"3.12"}]') }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked

    # The whole suite, slow tests included, in parallel. Linux runners get
    # tests/conftest.py's tmpfs temp dir (SQLite fsyncs are the main cost).
    - name: Test with pytest
      run: |
        uv run pytest -n auto --cov=alomancy --cov-report=xml --cov-report=term --cov-fail-under=80 tests/
      env:
        ALOMANCY_TEST_MODE: "1"
        ALOMANCY_MOCK_EXTERNAL: "1"

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'release' || github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # The version comes from git tags (hatch-vcs)

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.10"

    - name: Build package
      run: uv build

    - name: Check package
      run: uvx twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    environment: release  # Use environment protection

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  documentation:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.10"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra docs

    - name: Build documentation
      id: build_docs
      run: uv run sphinx-build -b html docs docs/_build/html
      continue-on-error: true

    - name: Deploy to GitHub Pages
      if: steps.build_docs.outcome == 'success'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
