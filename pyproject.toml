[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "alomancy"
dynamic = ["version"]
description = "Active Learning framework for atomistic simulations with flexible workflows and HPC submission."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Julian Holland", email = "holland@fhi.mpg.de"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "ase>=3.22.0",
    "numpy>=2.0.0",
    "ezga-lib>=1.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.5.0",
    "expyre-wfl>=0.1.0",
    "mp_api>=0.40.0",
    "pymatgen>2024.2.20",
    "mace-torch>=0.3.0",
    "sage_lib>=0.1.9.13",
    "polars>=0.20.0",
    "deduplicate-lib>=0.1.0",
    "sevenn>=0.10.4",
]

[project.optional-dependencies]
# An extra (not a dependency group) so Read the Docs can install it.
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.2",
    "myst-parser>=0.18",
    "sphinxcontrib-napoleon>=0.7",
]

# Development-only dependencies (PEP 735). `uv sync` installs the `dev`
# group by default; never part of the published package.
[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-xdist>=3.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.scripts]
alomancy = "alomancy.cli.main:main"

[project.urls]
Homepage = "https://github.com/julianholland/ALomancy"
Repository = "https://github.com/julianholland/ALomancy"
Documentation = "https://alomancy.readthedocs.io"

# Version from git tags (vMAJOR.MINOR.PATCH), as before with setuptools_scm.
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "post-release", local_scheme = "no-local-version" }

# Written at build/install time; read by alomancy.version (not tracked).
[tool.hatch.build.hooks.vcs]
version-file = "src/alomancy/version.py"

# src layout. Non-Python package files (the logo PNGs, the report's
# suggestions.yaml) are included because they live inside the package.
[tool.hatch.build.targets.wheel]
packages = ["src/alomancy"]

[tool.hatch.build.targets.sdist]
include = [
    "src/alomancy",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "tests/results"]

# Testing configuration
[tool.pytest.ini_options]
# The only pytest config (pytest.ini used to shadow this section). Coverage
# is passed explicitly by CI (.github/workflows/ci.yml), never here.
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: every test that needs no HPC/network (enforced in tests/conftest.py)",
    "slow: real training, or > ~2 s even on tmpfs; left out of the local/pre-commit tier (-m \"unit and not slow\")",
    "integration: end-to-end tests against real external services",
    "requires_external: marks tests that require external dependencies (MACE, QE, etc.)",
    "requires_gpu: marks tests that require GPU",
    "requires_hpc: marks tests that require HPC resources",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]


[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

# Enable linting rules
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
    "B905",  # zip() without an explicit strict= parameter
    "UP007", # Use X | Y for type annotations (Python 3.10+)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]  # Allow unused arguments and assert statements in tests
"__init__.py" = ["F401"]     # Allow unused imports in __init__.py files

[tool.ruff.lint.isort]
known-first-party = ["alomancy"]
force-single-line = false
split-on-trailing-comma = true

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# MyPy configuration (keep as is)
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ase.*",
    "mace.*",
    "expyre.*",
    "tqdm.*",
]
ignore_missing_imports = true

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "src/alomancy/version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
