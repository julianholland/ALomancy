# Minimal pre-commit configuration
repos:
  # General code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements

  # Python formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Fast tier: every unit test except `slow` ones, in parallel (~20 s).
  # `python -m pytest` runs in the active venv, the one alomancy is
  # installed in. The full suite, with coverage, runs in CI.
  - repo: local
    hooks:
      - id: pytest-unit
        name: Unit tests (fast tier)
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        args: [-m, "unit and not slow", -n, auto, --tb=line, -q, tests/]
        stages: [pre-commit]

exclude: |
  (?x)^(
      \.git/|
      __pycache__/|
      build/|
      dist/|
      \.venv/|
      src/alomancy/_?version\.py
  )
